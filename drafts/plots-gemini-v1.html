<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1F5E3B" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>แปลง & รายละเอียดแปลง — ไร่อ้อย 281 ไร่</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ===== ภาษาภาพและตัวแปรชุดเดียวกับหน้าวันนี้ v5 (today-sugarcane-v5.html) ===== */
    :root {
      --brand: #1F5E3B;
      --brand-dark: #15452A;
      --brand-soft: #E8F3EC;
      --brand-mid: #A8CBB5;
      --bg: #F4F5F1;
      --surface: #FFFFFF;
      --surface-note: #EEF4F0;
      --ink: #16241B;
      --ink-2: #46594E;
      --ink-3: #6D7B72;
      --line: #B8C6BC;
      --line-soft: #D3DDD6;
      --border: #DCE3DC;
      --ask: #6D28D9;
      --ask-soft: #F3EEFF;
      --ask-border: #C4B5FD;
      --due: #C2410C;
      --due-soft: #FFF1E6;
      --due-border: #FDBA74;
      --nolog-bg: #F6EFE0;
      --nolog-ink: #7A5919;
      --nolog-border: #E6D2A2;
      --brown-ink: #6B3410;
      --water: #0369A1;
      --water-soft: #E0F2FE;
      --water-border: #BAE6FD;
      --cut: #15803D;
      --car: #B45309;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow: 0 1px 3px rgba(20, 46, 30, 0.06), 0 1px 1px rgba(20, 46, 30, 0.03);
      --shadow-md: 0 4px 12px rgba(20, 46, 30, 0.08), 0 1px 2px rgba(20, 46, 30, 0.04);
      --tab-h: 58px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* โหมดกลางแดดจัด (เพิ่มคอนทราสต์เหมือน v5) */
    body.sun-boost {
      --border: #B2C1B5;
      --ink-2: #2A3C31;
      --ink-3: #45594E;
      --shadow: 0 1px 3px rgba(10, 26, 16, 0.13);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    /* iPhone: html และ body ไม่เลื่อน */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--ink);
      font-family: 'IBM Plex Sans Thai', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15px;
      line-height: 1.42;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    button, input, select, textarea {
      font-family: inherit;
    }

    /* ช่องพิมพ์ 16px เสมอ กัน iPhone ซูม */
    input, select, textarea {
      font-size: 16px;
    }

    .tabular {
      font-variant-numeric: tabular-nums;
    }

    /* กรอบจอ iPhone 390x844 */
    .phone-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      max-width: 390px;
      margin: 0 auto;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    @media (min-width: 440px) and (min-height: 700px) {
      .phone-frame {
        top: 50%;
        left: 50%;
        right: auto;
        bottom: auto;
        transform: translate(-50%, -50%);
        width: 390px;
        height: min(844px, calc(100dvh - 24px));
        border-radius: 34px;
        border: 1px solid #CFD8D0;
        box-shadow: 0 22px 60px rgba(20, 46, 30, 0.14), 0 4px 14px rgba(20, 46, 30, 0.06);
      }
    }

    /* แถบกันพื้นที่ใต้รอยบากด้านบน */
    .safe-top-bar {
      height: var(--safe-top);
      background: var(--brand);
      flex-shrink: 0;
      transition: background 0.18s ease;
    }

    .phone-frame.in-detail .safe-top-bar {
      background: var(--bg);
    }

    /* ===== โครงสลับ 2 หน้าในไฟล์เดียว (หน้า 1 แปลง / หน้า 2 รายละเอียดแปลง) ===== */
    .views-stage {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* กล่อง #app เริ่มใต้ env(safe-area-inset-top) และเป็นตัวเลื่อนหลักของหน้า 1 */
    #app {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      padding-bottom: calc(var(--tab-h) + var(--safe-bottom) + 18px);
    }

    #app::-webkit-scrollbar,
    #detailScroll::-webkit-scrollbar {
      display: none;
    }

    /* ===== หัวเขียวของแอปจริง (วาดไว้ดูตำแหน่ง + ปุ่มใช้งานจริงได้) ===== */
    .app-green-bar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--brand);
      color: #FFFFFF;
      padding: 10px 14px 11px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .app-green-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .app-green-kicker {
      font-size: 12.5px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.82);
      line-height: 1.25;
    }

    .app-green-title {
      margin: 1px 0 0;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.18;
      color: #FFFFFF;
    }

    .app-green-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .green-hdr-btn {
      height: 34px;
      padding: 0 10px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.14);
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.1s, background 0.15s;
    }

    .green-hdr-btn:active {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.24);
    }

    .green-hdr-btn.is-white {
      background: #FFFFFF;
      border-color: #FFFFFF;
      color: var(--brand-dark);
    }

    .green-hdr-btn.is-icon {
      width: 34px;
      padding: 0;
    }

    .green-hdr-btn.is-sun-on {
      background: #FEF3C7;
      border-color: #FCD34D;
      color: #92400E;
    }

    /* ===== Main Content Flow (v5) ===== */
    .main-stack {
      padding: 12px 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ===== Section Header (v5 exact classes) ===== */
    .sec-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      padding: 0 2px;
    }

    .sec-title-wrap {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .sec-title {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.01em;
    }

    .sec-head-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .sec-badge {
      font-size: 12px;
      font-weight: 600;
      padding: 1px 8px;
      border-radius: 999px;
      background: #E5ECE6;
      color: var(--brand-dark);
      line-height: 1.45;
      white-space: nowrap;
    }

    .sec-badge.is-ask {
      background: var(--ask-soft);
      color: var(--ask);
    }

    .sec-badge.is-due {
      background: var(--due-soft);
      color: var(--due);
    }

    .sec-badge.is-ok {
      background: var(--brand-soft);
      color: var(--brand-dark);
    }

    .sec-badge.is-muted {
      background: #EAEFE9;
      color: var(--ink-2);
      font-weight: 500;
    }

    .sec-toggle-btn {
      height: 28px;
      padding: 0 7px;
      border: none;
      background: transparent;
      color: var(--ink-2);
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      border-radius: 8px;
      cursor: pointer;
    }

    .sec-toggle-btn:active {
      background: rgba(31, 94, 59, 0.08);
    }

    /* ===== แถบสรุปบนสุดเล็ก ๆ (ชิ้นใหม่ตระกูล v5) ===== */
    .farm-strip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .farm-strip-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .farm-strip-main {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .farm-strip-sub {
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-2);
    }

    .farm-strip-pills {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      padding-top: 7px;
      border-top: 1px solid #EEF2EE;
    }

    .stat-mini-chip {
      border: 1px solid var(--border);
      background: #F7F9F7;
      color: var(--ink-2);
      font-size: 12.5px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      line-height: 1.4;
      transition: transform 0.1s, border-color 0.15s;
    }

    .stat-mini-chip:active {
      transform: scale(0.96);
    }

    .stat-mini-chip.is-due {
      background: var(--due-soft);
      border-color: var(--due-border);
      color: var(--due);
    }

    .stat-mini-chip.is-doing {
      background: var(--brand-soft);
      border-color: var(--brand-mid);
      color: var(--brand-dark);
    }

    .stat-mini-chip.is-active-filter {
      box-shadow: 0 0 0 1.5px var(--brand);
    }

    /* ===== Segmented Control (v5 exact classes) ===== */
    .seg-bar {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 2px;
      padding: 3px;
      background: #E5EBE6;
      border-radius: 11px;
    }

    .seg-bar.is-3col {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 3px;
    }

    .seg-btn {
      height: 34px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--ink-2);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      transition: background 0.16s, color 0.16s, box-shadow 0.16s;
      white-space: nowrap;
      padding: 0 3px;
    }

    .seg-btn.active {
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 1px 3px rgba(20, 46, 30, 0.1);
    }

    .seg-cnt {
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-3);
    }

    .seg-btn.active .seg-cnt {
      color: var(--brand);
    }

    /* ===== เครื่องมือ 4 อัน (คู่บนแบบ v5 .tele-card + คู่ล่างแบบ v5 .grouped-card) ===== */
    .tools-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tools-top-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .tele-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 11px 11px 10px;
      box-shadow: var(--shadow);
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
      min-width: 0;
      transition: transform 0.1s, border-color 0.15s;
    }

    .tele-card:active {
      transform: scale(0.982);
      border-color: var(--brand-mid);
    }

    .tele-card.is-warn-card {
      background: #FFFEFC;
      border-color: var(--due-border);
    }

    .tele-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .tele-label {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .tele-ico {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .tele-ico.is-map {
      background: var(--brand-soft);
      color: var(--brand);
    }

    .tele-ico.is-sat {
      background: #EDF2EE;
      color: var(--brand-dark);
    }

    .tele-ico.is-sat-warn {
      background: var(--due-soft);
      color: var(--due);
    }

    .tele-sub {
      font-size: 13px;
      color: var(--ink-2);
      line-height: 1.32;
    }

    .tele-status-ok {
      color: var(--brand-dark);
      font-weight: 600;
    }

    .tele-status-due {
      color: var(--due);
      font-weight: 700;
    }

    /* ===== Grouped iOS Card & Status Row (v5 exact classes) ===== */
    .grouped-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .status-row {
      padding: 11px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: relative;
    }

    .status-row + .status-row {
      border-top: 1px solid #E9EFEA;
    }

    .status-row.is-clickable {
      cursor: pointer;
    }

    .status-row.is-clickable:active {
      background: #F8FAF8;
    }

    .status-row-left {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .status-icon-box {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .status-icon-box.is-water {
      background: var(--water-soft);
      color: var(--water);
    }

    .status-icon-box.is-due {
      background: var(--due-soft);
      color: var(--due);
    }

    .status-icon-box.is-ok {
      background: var(--brand-soft);
      color: var(--brand);
    }

    .status-icon-box.is-nolog {
      background: var(--nolog-bg);
      color: var(--nolog-ink);
    }

    .status-icon-box.is-muted {
      background: #EEF2EE;
      color: var(--ink-2);
    }

    .status-info {
      min-width: 0;
      flex: 1;
    }

    .status-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .status-title {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.3;
    }

    .status-sub {
      font-size: 13px;
      color: var(--ink-2);
      margin-top: 2px;
      line-height: 1.35;
    }

    /* แถบสัดส่วนความชื้นดิน 20:5 */
    .soil-bar-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 5px;
    }

    .soil-bar-track {
      flex: 1;
      max-width: 112px;
      height: 5px;
      border-radius: 999px;
      background: var(--due-soft);
      overflow: hidden;
      display: flex;
    }

    .soil-bar-ok {
      height: 100%;
      background: var(--water);
      border-radius: 999px 0 0 999px;
    }

    .soil-bar-dry {
      height: 100%;
      background: var(--due);
    }

    .tool-pills-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 4px;
    }

    .chev {
      color: var(--ink-3);
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      transition: transform 0.2s ease;
    }

    /* ===== ป้ายสถานะ (v5 exact classes) ===== */
    .st-pill {
      font-size: 12px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      flex-shrink: 0;
      line-height: 1.35;
    }

    .st-pill.doing {
      background: var(--brand-soft);
      color: var(--brand-dark);
    }

    .st-pill.due {
      background: var(--due-soft);
      color: var(--due);
    }

    .st-pill.watch {
      background: #FEF3C7;
      color: #92400E;
    }

    .st-pill.done {
      background: var(--brand-soft);
      color: var(--brand-dark);
    }

    .st-pill.muted {
      background: #EDF2EE;
      color: var(--ink-2);
    }

    .pulse-dot {
      width: 6.5px;
      height: 6.5px;
      border-radius: 50%;
      background: var(--brand);
      box-shadow: 0 0 0 0 rgba(31, 94, 59, 0.55);
      animation: livePulse 2s infinite;
    }

    @keyframes livePulse {
      0% { box-shadow: 0 0 0 0 rgba(31, 94, 59, 0.5); }
      70% { box-shadow: 0 0 0 5px rgba(31, 94, 59, 0); }
      100% { box-shadow: 0 0 0 0 rgba(31, 94, 59, 0); }
    }

    /* ===== รายการพื้นที่ 9 พื้นที่ (Accordion ตระกูล v5) ===== */
    .zone-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .zone-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .zone-card.has-doing {
      border-left: 4px solid var(--brand);
    }

    .zone-card.has-due {
      border-left: 4px solid var(--due);
    }

    .zone-head {
      width: 100%;
      padding: 11px 12px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      text-align: left;
      transition: background 0.14s;
    }

    .zone-head:active {
      background: #F8FAF8;
    }

    .zone-head-left {
      min-width: 0;
      flex: 1;
    }

    .zone-title-line {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .zone-name {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.28;
    }

    .zone-meta {
      margin-top: 2px;
      font-size: 13px;
      color: var(--ink-2);
      line-height: 1.35;
    }

    .zone-card.is-open .zone-chev {
      transform: rotate(180deg);
    }

    .zone-plots {
      border-top: 1px solid #E9EFEA;
      background: #FAFBF9;
    }

    /* แถวแปลงในพื้นที่ (แตะ = ไปหน้า 2) */
    .plot-row {
      width: 100%;
      padding: 10px 12px;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      text-align: left;
      cursor: pointer;
      position: relative;
      transition: background 0.14s;
    }

    .plot-row + .plot-row {
      border-top: 1px solid #ECEFEA;
    }

    .plot-row:active {
      background: var(--brand-soft);
    }

    .plot-row.st-doing {
      background: #FFFFFF;
      box-shadow: inset 3px 0 0 var(--brand);
    }

    .plot-row.st-due {
      background: #FFFEFC;
      box-shadow: inset 3px 0 0 var(--due);
    }

    .plot-row-left {
      min-width: 0;
      flex: 1;
    }

    .plot-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.3;
    }

    .plot-meta-line {
      margin-top: 3px;
      font-size: 13px;
      color: var(--ink-2);
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px 6px;
      line-height: 1.32;
    }

    .plot-rai {
      font-weight: 700;
      color: var(--ink);
    }

    .crop-tag {
      font-size: 12px;
      font-weight: 600;
      padding: 0 6px;
      border-radius: 5px;
      line-height: 1.5;
    }

    .crop-tag.is-ratoon {
      background: #F4ECE1;
      color: var(--brown-ink);
    }

    .crop-tag.is-new {
      background: var(--brand-soft);
      color: var(--brand-dark);
    }

    .water-ago {
      font-size: 12.5px;
      color: var(--ink-2);
    }

    .water-ago.is-dry {
      color: var(--due);
      font-weight: 600;
    }

    .plot-row-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .empty-filter-box {
      background: var(--surface);
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      padding: 20px 14px;
      text-align: center;
      color: var(--ink-2);
      font-size: 14px;
    }

    /* =========================================================================
       หน้า 2: รายละเอียดแปลง (เปิดเต็มจอ มีปุ่ม ‹ ย้อนกลับซ้ายบน)
       ========================================================================= */
    .detail-page {
      position: absolute;
      inset: 0;
      z-index: 60;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }

    .detail-page.is-open {
      transform: translateX(0);
      pointer-events: auto;
    }

    /* แถบหัวหน้า 2 (Sticky ใต้ safe-area-inset-top) */
    .detail-topbar {
      background: rgba(244, 245, 241, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(31, 94, 59, 0.1);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .back-btn {
      height: 36px;
      padding: 0 10px 0 6px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--brand-dark);
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      box-shadow: var(--shadow);
      flex-shrink: 0;
      transition: transform 0.1s, background 0.15s;
    }

    .back-btn:active {
      transform: scale(0.96);
      background: var(--brand-soft);
    }

    .detail-topbar-mid {
      min-width: 0;
      flex: 1;
      text-align: center;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--ink-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hdr-btn {
      height: 36px;
      padding: 0 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      box-shadow: var(--shadow);
      white-space: nowrap;
    }

    .hdr-btn.is-icon {
      width: 36px;
      padding: 0;
      color: var(--ink-2);
    }

    .hdr-btn:active {
      transform: scale(0.96);
      background: var(--brand-soft);
    }

    /* กล่องเลื่อนหน้า 2 */
    #detailScroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      padding-bottom: calc(var(--safe-bottom) + 26px);
    }

    /* 1. หัวแปลง */
    .plot-hero {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 13px 13px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .plot-hero-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .plot-hero-title {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
      line-height: 1.24;
    }

    .plot-hero-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 8px;
      font-size: 13.5px;
      color: var(--ink-2);
    }

    .plot-hero-meta strong {
      color: var(--ink);
      font-weight: 700;
    }

    .meta-dot {
      color: var(--line);
    }

    /* 2. ตัวเลขหลัก 4 ช่อง (3 ช่องบน + ช่องถัดไป) */
    .kpi-3-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .kpi-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 9px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .kpi-box.is-due {
      border-color: var(--due-border);
      background: #FFFEFC;
    }

    .kpi-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-3);
      line-height: 1.25;
    }

    .kpi-val {
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.28;
    }

    .kpi-box.is-due .kpi-val {
      color: var(--due);
    }

    /* ช่องที่ 4: ถัดไป (ตระกูล v5 .task-card.st-doing) */
    .task-card {
      width: 100%;
      padding: 11px 12px 11px 13px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left-width: 4px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .task-card.st-doing {
      border-left-color: var(--brand);
    }

    .task-card.st-due {
      border-left-color: var(--due);
      background: #FFFEFC;
    }

    .task-card.st-ok {
      border-left-color: var(--brand-mid);
      background: #FAFBF9;
    }

    .next-card-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .next-kicker {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-3);
    }

    .next-text {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--brand-dark);
      line-height: 1.34;
      margin-top: 2px;
    }

    .task-inline-btn {
      height: 31px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #F6F8F6;
      color: var(--ink);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      transition: transform 0.1s, background 0.15s;
    }

    .task-inline-btn:active {
      transform: scale(0.95);
    }

    .task-inline-btn.is-doing {
      border-color: var(--brand-mid);
      background: var(--brand-soft);
      color: var(--brand-dark);
    }

    .task-inline-btn.is-solid {
      border-color: var(--brand);
      background: var(--brand);
      color: #FFFFFF;
    }

    .task-inline-btn.is-undo {
      border-color: var(--border);
      background: #FFFFFF;
      color: var(--ink-2);
    }

    /* 3. ปุ่มหลัก (ขนาดพอดีมือ iPhone ไม่ใหญ่เทอะทะ) */
    .action-pair-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .action-pair {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 8px;
    }

    .act-btn {
      height: 40px;
      padding: 0 12px;
      border-radius: 11px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: var(--shadow);
      transition: transform 0.1s, background 0.15s;
      white-space: nowrap;
    }

    .act-btn:active {
      transform: scale(0.97);
    }

    .act-btn.is-primary {
      background: var(--brand);
      border-color: var(--brand);
      color: #FFFFFF;
    }

    .act-btn.is-primary:active {
      background: var(--brand-dark);
    }

    .map-measure-note {
      font-size: 12.5px;
      color: var(--ink-3);
      padding: 0 2px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* 4. วิเคราะห์แปลงนี้ — การ์ดข้อมูล 4 ชั้น */
    .analysis-row {
      padding: 11px 12px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .analysis-row + .analysis-row {
      border-top: 1px solid #E9EFEA;
    }

    .analysis-body {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    /* ชั้นที่ 1: หัวเล็กเทา */
    .an-l1 {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-3);
      line-height: 1.3;
    }

    /* ชั้นที่ 2: หัวข้อหนาสีตามสถานะ */
    .an-l2 {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--ink);
    }

    .an-l2.is-due { color: var(--due); }
    .an-l2.is-muted { color: var(--ink-2); }
    .an-l2.is-nolog { color: var(--nolog-ink); }
    .an-l2.is-ok { color: var(--brand-dark); }

    /* ชั้นที่ 3: ข้อเท็จจริง */
    .an-l3 {
      font-size: 13.5px;
      color: var(--ink);
      line-height: 1.38;
    }

    /* ชั้นที่ 4: หมายเหตุเทา */
    .an-l4 {
      font-size: 12px;
      color: var(--ink-3);
      line-height: 1.36;
      margin-top: 1px;
    }

    /* 5. หมวดงาน (พับ/กางได้ + บรรทัดสรุปตอนพับ) */
    .cat-acc + .cat-acc {
      border-top: 1px solid #E9EFEA;
    }

    .cat-acc-head {
      width: 100%;
      padding: 11px 12px;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      text-align: left;
      cursor: pointer;
      transition: background 0.14s;
    }

    .cat-acc-head:active {
      background: #F8FAF8;
    }

    .cat-acc-left {
      min-width: 0;
      flex: 1;
    }

    .cat-acc-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .cat-acc-title {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.3;
    }

    .cat-acc-sum {
      font-size: 13px;
      color: var(--ink-2);
      margin-top: 2px;
      line-height: 1.34;
    }

    .cat-acc-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .cat-acc.is-open .cat-chev {
      transform: rotate(180deg);
    }

    .cat-acc-body {
      border-top: 1px solid #ECEFEA;
      background: #FAFBF9;
      padding: 10px 12px 11px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* แถบขั้นตอน (ชิ้นใหม่ตระกูล v5) */
    .step-progress-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-segments {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      flex: 1;
      max-width: 150px;
    }

    .step-seg {
      height: 5px;
      border-radius: 999px;
      background: #DDE5DF;
    }

    .step-seg.is-done {
      background: var(--brand);
    }

    .step-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .step-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 9px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid #E5ECE6;
      font-size: 13.5px;
    }

    .step-item.is-pending {
      background: transparent;
      border-style: dashed;
      border-color: var(--line);
    }

    .step-item-left {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      min-width: 0;
      flex: 1;
    }

    .step-mark {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .step-mark.done {
      background: var(--brand-soft);
      color: var(--brand-dark);
    }

    .step-mark.pending {
      background: #EAEFE9;
      color: var(--ink-3);
    }

    .step-mark.extra {
      background: #FEF3C7;
      color: #92400E;
    }

    .step-name {
      font-weight: 600;
      color: var(--ink);
      line-height: 1.3;
    }

    .step-item.is-pending .step-name {
      color: var(--ink-2);
      font-weight: 500;
    }

    .step-meta {
      font-size: 12.5px;
      color: var(--ink-3);
      margin-top: 1px;
    }

    .step-date {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-2);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* รายการรอบน้ำ/ตัดอ้อยในหมวดงาน */
    .sub-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 9px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid #E5ECE6;
      font-size: 13.5px;
    }

    .sub-row-left {
      min-width: 0;
      flex: 1;
    }

    .sub-row-title {
      font-weight: 600;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .sub-row-meta {
      font-size: 12.5px;
      color: var(--ink-2);
      margin-top: 1px;
    }

    .cat-empty-note {
      font-size: 13px;
      color: var(--ink-3);
      line-height: 1.4;
    }

    /* 6. ประวัติงาน — ไทม์ไลน์แถวละ 3 ช่อง (ชิ้นใหม่ตระกูล v5) */
    .tl-year-bar {
      padding: 6px 12px;
      background: #F3F6F3;
      border-bottom: 1px solid #E6ECE7;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink-2);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tl-item + .tl-item {
      border-top: 1px solid #ECEFEA;
    }

    .tl-row {
      padding: 10px 10px 10px 12px;
      display: grid;
      grid-template-columns: 74px minmax(0, 1fr) 32px;
      gap: 8px;
      align-items: start;
    }

    .tl-date-col {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1px;
    }

    .tl-date-main {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.25;
    }

    .tl-date-year {
      font-size: 11.5px;
      color: var(--ink-3);
      line-height: 1.2;
    }

    .tl-span-pill {
      margin-top: 3px;
      font-size: 11px;
      font-weight: 600;
      padding: 0 6px;
      border-radius: 999px;
      background: #EDF2EE;
      color: var(--ink-2);
      line-height: 1.5;
    }

    .tl-work-col {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .tl-tag-line {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 1px;
    }

    /* ป้ายสีบอกชนิดงาน */
    .work-tag {
      font-size: 11.5px;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 6px;
      line-height: 1.45;
      white-space: nowrap;
    }

    .work-tag.spray   { background: var(--brand-soft); color: var(--brand-dark); }
    .work-tag.water   { background: var(--water-soft); color: var(--water); }
    .work-tag.tractor { background: #FEF3C7; color: #92400E; }
    .work-tag.cut     { background: #F4E6D8; color: var(--brown-ink); }
    .work-tag.fert    { background: var(--ask-soft); color: var(--ask); }
    .work-tag.rain    { background: #E6F4FE; color: #0284C7; }

    .tl-work-title {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.3;
    }

    .tl-work-detail {
      font-size: 13px;
      color: var(--ink-2);
      line-height: 1.35;
    }

    .tl-more-btn {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--ink-3);
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.14s, color 0.14s;
    }

    .tl-more-btn:active,
    .tl-item.is-menu-open .tl-more-btn {
      background: #EDF2EE;
      color: var(--ink);
    }

    /* แถบปุ่มแก้/ลบ กางในแถวเมื่อแตะ ⋯ */
    .tl-inline-actions {
      padding: 0 12px 10px 94px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .tl-act-btn {
      height: 30px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #F7F9F7;
      color: var(--ink);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .tl-act-btn:active {
      transform: scale(0.96);
    }

    .tl-act-btn.is-del {
      border-color: #FECACA;
      background: #FEF2F2;
      color: #B91C1C;
    }

    /* 7. ท้ายหน้า: แก้ข้อมูลแปลง */
    .edit-plot-row {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      text-align: left;
      transition: transform 0.1s, background 0.15s;
    }

    .edit-plot-row:active {
      transform: scale(0.99);
      background: #F8FAF8;
    }

    /* ===== เมนูล่าง 5 ปุ่ม (v5 exact classes) ===== */
    .bottom-nav {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 40;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      padding-bottom: var(--safe-bottom);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
    }

    .nav-tab {
      height: var(--tab-h);
      border: none;
      background: transparent;
      color: var(--ink-3);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 4px 2px;
      transition: color 0.15s;
      position: relative;
    }

    .nav-tab.active {
      color: var(--brand);
    }

    .nav-tab svg {
      width: 22px;
      height: 22px;
    }

    .nav-tab span {
      font-size: 11px;
      font-weight: 600;
      line-height: 1.1;
    }

    /* ===== Bottom Sheet (v5 exact classes) ===== */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 2100;
      background: rgba(16, 32, 22, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    .sheet-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet-panel {
      width: 100%;
      max-width: 390px;
      max-height: 84dvh;
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
      overflow: hidden;
      box-shadow: 0 -6px 28px rgba(0, 0, 0, 0.16);
      padding-bottom: var(--safe-bottom);
      will-change: transform;
    }

    .sheet-backdrop.open .sheet-panel {
      transform: translateY(0);
    }

    .sheet-panel.is-dragging {
      transition: none;
    }

    .sheet-drag-zone {
      padding-top: 8px;
      cursor: grab;
      touch-action: none;
      flex-shrink: 0;
    }

    .sheet-handle {
      width: 38px;
      height: 4px;
      border-radius: 999px;
      background: #D0D8D2;
      margin: 0 auto 6px;
    }

    .sheet-header {
      padding: 4px 14px 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }

    .sheet-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.3;
    }

    .sheet-subtitle {
      font-size: 13px;
      color: var(--ink-2);
      margin-top: 2px;
    }

    .sheet-close {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: none;
      background: #EFF3F0;
      color: var(--ink);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .sheet-body {
      padding: 14px 16px 22px;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .detail-box {
      padding: 11px 13px;
      border-radius: 12px;
      background: #F7F9F7;
      border: 1px solid var(--border);
      font-size: 14px;
      color: var(--ink);
    }

    .detail-box.is-due {
      background: var(--due-soft);
      border-color: var(--due-border);
    }

    .detail-box.is-ask {
      background: var(--ask-soft);
      border-color: var(--ask-border);
    }

    .detail-box.is-warn {
      background: #FFFBEB;
      border-color: #FCD34D;
    }

    .detail-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-2);
      margin-bottom: 5px;
    }

    .sheet-btn-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 2px;
    }

    .sheet-btn {
      flex: 1;
      height: 42px;
      padding: 0 14px;
      border-radius: 11px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s;
    }

    .sheet-btn:active {
      transform: scale(0.985);
    }

    .sheet-btn.primary {
      border-color: var(--brand);
      background: var(--brand);
      color: #FFFFFF;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-2);
    }

    .form-input, .form-select {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      font-size: 16px;
      outline: none;
    }

    .form-input:focus, .form-select:focus {
      border-color: var(--brand);
    }

    .hist-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 0;
      border-bottom: 1px solid #EAEFEA;
      font-size: 13.5px;
    }

    .hist-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    /* แผนที่จำลองในแผ่นล่าง */
    .mini-map-box {
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #E8F0E8;
      overflow: hidden;
      position: relative;
    }

    /* Toast (v5 exact classes) */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(var(--tab-h) + var(--safe-bottom) + 14px);
      transform: translateX(-50%) translateY(24px);
      background: var(--ink);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 500;
      padding: 9px 15px;
      border-radius: 999px;
      z-index: 2200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
      white-space: nowrap;
      max-width: 356px;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 6px 20px rgba(16, 32, 22, 0.24);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .is-hidden {
      display: none !important;
    }
  </style>
</head>

      /* ===== ค้นหาแปลงพร้อมสร้างข้อมูลเริ่มต้นถ้าเป็นแปลงอื่นนอกจากหนองกระทู้ (ขวาใน) ===== */
      function findPlotWithZone(plotId) {
        for (const z of state.zones) {
          const p = z.plots.find(x => x.id === plotId);
          if (p) {
            ensurePlotDetailData(p);
            return { zone: z, plot: p };
          }
        }
        return null;
      }

        if (p.history) return;
        p.plantDate = p.type === 'new' ? '12 มี.ค. 69' : '10 ก.พ. 69';
        p.sprayTanks = 0;
        p.measuredArea = `${p.rai} ไร่ 1 งาน 24 ตร.วา`;
        p.activeJobDone = false;
        p.nextAction = p.status === 'doing'
          ? 'ลุยงานที่ค้างให้จบ (เสร็จแล้วกดปุ่ม งานเสร็จ)'

        p.prepSteps = [

      /* ===== Bottom Sheet Engine (เหมือน v5 เป๊ะ) ===== */
      const backdrop = $('#sheetBackdrop');
      const panel = $('#sheetPanel');
      const dragZone = $('#sheetDragZone');

      function openSheet({ title, subtitle = '', bodyHTML = '', onMount = null }) {
        $('#sheetTitle').textContent = title;
        $('#sheetSubtitle').textContent = subtitle;
        $('#sheetSubtitle').style.display = subtitle ? 'block' : 'none';
        $('#sheetBody').innerHTML = bodyHTML;
        panel.style.transform = '';
        panel.classList.remove('is-dragging');
        backdrop.classList.add('open');
        backdrop.setAttribute('aria-hidden', 'false');
        if (typeof onMount === 'function') onMount($('#sheetBody'));
      }

      function closeSheet() {
        panel.classList.remove('is-dragging');
        panel.style.transform = '';
        backdrop.classList.remove('open');
        backdrop.setAttribute('aria-hidden', 'true');
      }

      $('#sheetCloseBtn').addEventListener('click', closeSheet);
      backdrop.addEventListener('click', (e) => {
        if (e.target === backdrop) closeSheet();
      });

      let dragStartY = 0, dragDeltaY = 0, isDraggingSheet = false;
      dragZone.addEventListener('touchstart', (e) => {
        if (!backdrop.classList.contains('open')) return;
        dragStartY = e.touches[0].clientY;
        dragDeltaY = 0;
        isDraggingSheet = true;
        panel.classList.add('is-dragging');
      }, { passive: true });
      dragZone.addEventListener('touchmove', (e) => {
        if (!isDraggingSheet) return;
        dragDeltaY = Math.max(0, e.touches[0].clientY - dragStartY);
        panel.style.transform = `translateY(${dragDeltaY}px)`;
      }, { passive: true });
      dragZone.addEventListener('touchend', () => {
        if (!isDraggingSheet) return;
        isDraggingSheet = false;
        panel.classList.remove('is-dragging');
        if (dragDeltaY > 64) closeSheet();
        else panel.style.transform = '';
      });

      /* ===== สลับโหมดสู้แดดจัด ===== */
      function toggleSunBoost() {
        state.sunBoost = !state.sunBoost;
        document.body.classList.toggle('sun-boost', state.sunBoost);
        $('#btnSunToggle').classList.toggle('is-sun-on', state.sunBoost);
        showToast(state.sunBoost ? 'เปิดโหมดสู้แดดจัดแล้ว' : 'กลับสู่ความคมชัดปกติ');
      }
      $('#btnSunToggle').addEventListener('click', toggleSunBoost);
      $('#btnDetailSun').addEventListener('click', toggleSunBoost);

      /* ===== Render หน้า 1: แถบสรุป + เครื่องมือ + รายการพื้นที่ ===== */
      function getAllPlots() {
        return state.zones.flatMap(z => z.plots.map(p => ({ ...p, zoneId: z.id, zoneName: z.name })));
      }

      function renderSummaryStrip() {
        const all = getAllPlots();
        const totalRai = all.reduce((s, p) => s + Number(p.rai || 0), 0);
        const newCount = all.filter(p => p.type === 'new').length;
        const ratoonCount = all.filter(p => p.type === 'ratoon').length;
        const dueCount = all.filter(p => p.status === 'due').length;
        const doingCount = all.filter(p => p.status === 'doing').length;

        $('.app-green-title').textContent = `แปลงทั้งไร่ · ${totalRai} ไร่`;
        $('.farm-strip-main').textContent = `${totalRai} ไร่ · ${all.length} แปลง`;
        $('#summaryCropCounts').textContent = `อ้อยใหม่ ${newCount} · อ้อยตอ ${ratoonCount}`;

        $('#summaryQuickPills').innerHTML = `
          <button type="button" class="stat-mini-chip is-due${state.filter === 'due' ? ' is-active-filter' : ''}" data-quick-filter="due">
            ถึงคิว <strong>${dueCount}</strong>
          </button>
          <button type="button" class="stat-mini-chip is-doing${state.filter === 'doing' ? ' is-active-filter' : ''}" data-quick-filter="doing">
            <span class="pulse-dot"></span>กำลังทำ <strong>${doingCount}</strong>
          </button>
          <button type="button" class="stat-mini-chip${state.filter === 'new' ? ' is-active-filter' : ''}" data-quick-filter="new">
            อ้อยใหม่ <strong>${newCount}</strong>
          </button>
          <button type="button" class="stat-mini-chip${state.filter === 'ratoon' ? ' is-active-filter' : ''}" data-quick-filter="ratoon">
            อ้อยตอ <strong>${ratoonCount}</strong>
          </button>
        `;

        $('#summaryQuickPills').querySelectorAll('[data-quick-filter]').forEach(btn => {
          btn.addEventListener('click', () => {
            const target = btn.dataset.quickFilter;
            setPlotFilter(state.filter === target ? 'all' : target);
          });
        });
      }

      function renderSatelliteCard() {
        const card = $('#toolSat');
        const ico = $('#satIcoBox');
        const txt = $('#satSummaryText');
        if (state.satWarning) {
          card.classList.add('is-warn-card');
          ico.className = 'tele-ico is-sat-warn';
          txt.innerHTML = `<span class="tele-status-due">แห้งลง 1 แปลง</span>`;
        } else {
          card.classList.remove('is-warn-card');
          ico.className = 'tele-ico is-sat';
          txt.innerHTML = `<span class="tele-status-ok">✓ ปกติ 25 แปลง</span>`;
        }
      }

      function matchesFilter(plot) {
        if (state.filter === 'all') return true;
        if (state.filter === 'due') return plot.status === 'due';
        if (state.filter === 'doing') return plot.status === 'doing';
        if (state.filter === 'new') return plot.type === 'new';
        if (state.filter === 'ratoon') return plot.type === 'ratoon';
        return true;
      }

      function setPlotFilter(nextFilter) {
        state.filter = nextFilter;
        document.querySelectorAll('#plotFilterBar .seg-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.filter === nextFilter);
        });
        // เมื่อกรองเฉพาะ ถึงคิว หรือ กำลังทำ ให้กางพื้นที่ที่ตรงเงื่อนไขอัตโนมัติเพื่อให้เห็นแปลงทันที
        if (nextFilter === 'due' || nextFilter === 'doing') {
          state.zones.forEach(z => {
            if (z.plots.some(matchesFilter)) state.expandedZones[z.id] = true;
          });
        }
        renderSummaryStrip();
        renderZoneList();
      }

      function renderZoneList() {
        const container = $('#zoneList');
        const filteredZones = state.zones
          .map(z => ({ ...z, visiblePlots: z.plots.filter(matchesFilter) }))
          .filter(z => z.visiblePlots.length > 0);

        const visiblePlotTotal = filteredZones.reduce((s, z) => s + z.visiblePlots.length, 0);
        $('#zonesCountBadge').textContent = state.filter === 'all'
          ? `${filteredZones.length} พื้นที่`
          : `${visiblePlotTotal} แปลง`;

        const allOpen = filteredZones.length > 0 && filteredZones.every(z => state.expandedZones[z.id]);
        $('#btnToggleAllZones').textContent = allOpen ? 'พับทั้งหมด' : 'กางทั้งหมด';

        if (!filteredZones.length) {
          container.innerHTML = `<div class="empty-filter-box">ไม่พบแปลงที่ตรงกับตัวกรองนี้</div>`;
          return;
        }

        container.innerHTML = filteredZones.map(z => {
          const isOpen = !!state.expandedZones[z.id];
          const zoneRai = z.plots.reduce((s, p) => s + Number(p.rai || 0), 0);
          const doingCnt = z.plots.filter(p => p.status === 'doing').length;
          const dueCnt = z.plots.filter(p => p.status === 'due').length;

          const cardCls = [
            'zone-card',
            isOpen ? 'is-open' : '',
            doingCnt ? 'has-doing' : (dueCnt ? 'has-due' : '')
          ].filter(Boolean).join(' ');

          const statusPill = doingCnt
            ? `<span class="st-pill doing tabular"><span class="pulse-dot"></span>กำลังทำ ${doingCnt}</span>`
            : (dueCnt ? `<span class="st-pill due tabular">ถึงคิว ${dueCnt}</span>` : '');

          const plotsHTML = isOpen ? `
            <div class="zone-plots">
              ${z.visiblePlots.map(p => {
                const rowCls = `plot-row${p.status === 'doing' ? ' st-doing' : (p.status === 'due' ? ' st-due' : '')}`;
                const pPill = p.status === 'doing'
                  ? `<span class="st-pill doing">กำลังทำ</span>`
                  : (p.status === 'due' ? `<span class="st-pill due">ถึงคิว</span>` : '');
                const waterHTML = p.waterDays != null
                  ? `<span class="water-ago tabular${p.waterDays >= 15 ? ' is-dry' : ''}">· น้ำ ${p.waterDays} วันก่อน</span>`

                  <button type="button" class="${rowCls}" data-open-plot="${p.id}">

                      <div class="plot-meta-line tabular">

                        <span class="crop-tag ${p.type === 'new' ? 'is-new' : 'is-ratoon'}">${p.ageLabel}</span>

                    <div class="plot-row-right">
                      ${pPill}

                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
                      </span>
                    </div>
                  </button>
                `;
              }).join('')}
            </div>
          ` : '';

          return `
            <div class="${cardCls}">
              <button type="button" class="zone-head" data-toggle-zone="${z.id}" aria-expanded="${isOpen}">
                <div class="zone-head-left">

                </span>

        container.querySelectorAll('[data-toggle-zone]').forEach(btn => {
          btn.addEventListener('click', () => {
            const zid = btn.dataset.toggleZone;
            state.expandedZones[zid] = !state.expandedZones[zid];
            renderZoneList();

        container.querySelectorAll('[data-open-plot]').forEach(btn => {
          btn.addEventListener('click', () => openPlotDetail(btn.dataset.openPlot));

        const found = findPlotWithZone(plotId);
        if (!found) return;
        state.activePlotId = plotId;
        state.openHistoryMenuId = null;
        state.historyFilter = 'work';
        $('#detailTopbarZone').textContent = found.zone.name;
        renderPlotDetail();
        $('#detailScroll').scrollTop = 0;
        $('#detailPage').classList.add('is-open');
        $('#detailPage').setAttribute('aria-hidden', 'false');
        $('#phoneFrame').classList.add('in-detail');
      }

      function closePlotDetail() {
        $('#detailPage').classList.remove('is-open');
        $('#detailPage').setAttribute('aria-hidden', 'true');
        $('#phoneFrame').classList.remove('in-detail');
        state.openHistoryMenuId = null;
      }

      function bindDetailEvents(p, zone) {
        const btnFinish = $('#btnFinishPlotJob');
        if (btnFinish) {
          btnFinish.addEventListener('click', () => {
            p.activeJobDone = true;
            p.status = null;
            renderSummaryStrip();
            renderZoneList();
            renderPlotDetail();
            showToast(`บันทึกงานเสร็จในแปลง ${p.name} แล้ว`);
          });
        }

        const btnUndo = $('#btnUndoPlotJob');
        if (btnUndo) {
          btnUndo.addEventListener('click', () => {
            p.activeJobDone = false;
            p.status = 'doing';
            renderSummaryStrip();
            renderZoneList();
            renderPlotDetail();
            showToast('เปิดสถานะกำลังทำอีกครั้ง');
          });
        }

        $('#btnLogPlotWork').addEventListener('click', () => openLogWorkSheet(p));

        $('#btnViewPlotMap').addEventListener('click', () => {
          openSheet({
            title: p.name,
            subtitle: `โซน${zone.name} · วัดจากแนวบนแผนที่ได้ ${p.measuredArea}`,
            bodyHTML: `
              <div class="mini-map-box">
                <svg viewBox="0 0 340 165" width="100%" height="165" style="display:block;">
                  <rect width="340" height="165" fill="#E6EFE7"/>
                  <path d="M0,126 L340,112" stroke="#FFFFFF" stroke-width="7"/>
                  <polygon points="88,28 256,22 274,104 76,112" fill="#1F5E3B" fill-opacity="0.25" stroke="#1F5E3B" stroke-width="2.5"/>
                  <circle cx="88" cy="28" r="4" fill="#1F5E3B"/>
                  <circle cx="256" cy="22" r="4" fill="#1F5E3B"/>
                  <circle cx="274" cy="104" r="4" fill="#1F5E3B"/>
                  <circle cx="76" cy="112" r="4" fill="#1F5E3B"/>
                  <text x="172" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#15452A">${p.name}</text>
                  <text x="172" y="83" text-anchor="middle" font-size="12" font-weight="600" fill="#1F5E3B">${p.measuredArea}</text>
                </svg>
              </div>
              <div class="detail-box tabular">
                <div class="detail-label">ข้อมูลพื้นที่</div>
                <div>พื้นที่จดทะเบียน: <strong>${p.rai} ไร่</strong> · วัดจากแนวเขต: <strong>${p.measuredArea}</strong></div>
              </div>
              <button type="button" class="sheet-btn primary" id="btnClosePlotMap">ปิดแผนที่</button>
            `,
            onMount(body) {
              body.querySelector('#btnClosePlotMap').addEventListener('click', closeSheet);
            }
          });
        });

        // กาง/พับหมวดงาน
        $('#detailContent').querySelectorAll('[data-cat-toggle]').forEach(el => {
          el.addEventListener('click', () => {
            const key = el.dataset.catToggle;
            state.detailCatOpen[key] = !state.detailCatOpen[key];
            renderPlotDetail();
          });
        });

        $('#btnToggleAllCats').addEventListener('click', () => {
          const allOpen = Object.values(state.detailCatOpen).every(Boolean);
          Object.keys(state.detailCatOpen).forEach(k => { state.detailCatOpen[k] = !allOpen; });
          renderPlotDetail();
        });

        // + บันทึกผลผลิต
        const btnYield = $('#btnAddYield');
        if (btnYield) {
          btnYield.addEventListener('click', (e) => {
            e.stopPropagation();
            openSheet({
              title: 'บันทึกผลผลิตส่งโรงงาน',
              subtitle: `${p.name} · ${p.rai} ไร่`,
              bodyHTML: `
                <div class="form-row-2">
                  <div class="form-group">
                    <label class="form-label" for="yTons">น้ำหนักรวม (ตัน)</label>
                    <input type="number" inputmode="decimal" step="0.1" class="form-input tabular" id="yTons" placeholder="เช่น 96.5" />
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="yCcs">ค่าความหวาน (CCS)</label>
                    <input type="number" inputmode="decimal" step="0.1" class="form-input tabular" id="yCcs" placeholder="เช่น 12.4" />
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label" for="yNote">หมายเหตุ / โรงงาน</label>
                  <input type="text" class="form-input" id="yNote" placeholder="เช่น อ้อยสด ส่งโรงงานรอบแรก" />

                <button type="button" class="sheet-btn primary" id="btnSaveYield">บันทึกผลผลิต</button>
              `,
              onMount(body) {
                body.querySelector('#btnSaveYield').addEventListener('click', () => {
                  const tons = Number(body.querySelector('#yTons').value);
                  const ccs = body.querySelector('#yCcs').value.trim();
                  const note = body.querySelector('#yNote').value.trim();
                  if (!tons || tons <= 0) {
                    showToast('กรุณาใส่น้ำหนักตันก่อนบันทึก');
                    body.querySelector('#yTons').focus();
                    return;
                  }
                  p.yields.unshift({ date: '24 พ.ย. 69', tons, ccs, note });
                  state.detailCatOpen.yield = true;
                  renderPlotDetail();
                  closeSheet();
                  showToast(`บันทึกผลผลิต ${tons} ตันแล้ว`);

            });
          });

        // ตัวกรองประวัติงาน
        $('#detailContent').querySelectorAll('[data-hist-filter]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.historyFilter = btn.dataset.histFilter;
            state.openHistoryMenuId = null;
            renderPlotDetail();
          });
        });

        // ปุ่ม ⋯ กางปุ่มแก้/ลบในแถว
        $('#detailContent').querySelectorAll('[data-hist-more]').forEach(btn => {
          btn.addEventListener('click', () => {
            const hid = btn.dataset.histMore;
            state.openHistoryMenuId = state.openHistoryMenuId === hid ? null : hid;
            renderPlotDetail();
          });
        });

        // ปุ่ม ✏️ แก้ไขในแถว
        $('#detailContent').querySelectorAll('[data-hist-edit]').forEach(btn => {
          btn.addEventListener('click', () => {
            const h = p.history.find(x => x.id === btn.dataset.histEdit);
            if (!h) return;
            openSheet({
              title: 'แก้ไขรายการประวัติ',
              subtitle: `${h.date} ${h.year} · ${h.catLabel}`,
              bodyHTML: `
                <div class="form-group">
                  <label class="form-label" for="editHistTitle">ชื่องาน</label>
                  <input type="text" class="form-input" id="editHistTitle" value="${h.title}" />
                </div>
                <div class="form-group">
                  <label class="form-label" for="editHistDetail">รายละเอียด / คนงาน / รถ</label>
                  <input type="text" class="form-input" id="editHistDetail" value="${h.detail || ''}" />
                </div>
                <button type="button" class="sheet-btn primary" id="btnSaveHistEdit">บันทึกการแก้ไข</button>
              `,
              onMount(body) {
                body.querySelector('#btnSaveHistEdit').addEventListener('click', () => {
                  const nt = body.querySelector('#editHistTitle').value.trim();
                  if (!nt) { showToast('กรุณาใส่ชื่องาน'); return; }
                  h.title = nt;
                  h.detail = body.querySelector('#editHistDetail').value.trim();
                  state.openHistoryMenuId = null;
                  renderPlotDetail();
                  closeSheet();
                  showToast('แก้ไขรายการประวัติแล้ว');
                });
              }
            });
          });
        });

        // ปุ่ม 🗑️ ลบในแถว
        $('#detailContent').querySelectorAll('[data-hist-del]').forEach(btn => {
          btn.addEventListener('click', () => {
            const hid = btn.dataset.histDel;
            const idx = p.history.findIndex(x => x.id === hid);
            if (idx === -1) return;
            const removed = p.history.splice(idx, 1)[0];
            state.openHistoryMenuId = null;
            renderPlotDetail();
            showToast(`ลบ "${removed.title}" ออกจากประวัติแล้ว`);
          });
        });

        // ท้ายหน้า: ✏️ แก้ข้อมูลแปลง (แผ่นล่าง)
        $('#btnEditPlotInfo').addEventListener('click', () => {
          openSheet({
            title: 'แก้ข้อมูลแปลง',
            subtitle: `${p.name} · โซน${zone.name}`,
            bodyHTML: `
              <div class="form-group">
                <label class="form-label" for="epName">ชื่อแปลง (ชื่อเต็ม)</label>
                <input type="text" class="form-input" id="epName" value="${p.name}" />
              </div>
              <div class="form-row-2">
                <div class="form-group">
                  <label class="form-label" for="epRai">พื้นที่ (ไร่)</label>
                  <input type="number" inputmode="decimal" min="0.5" step="0.5" class="form-input tabular" id="epRai" value="${p.rai}" />
                </div>
                <div class="form-group">
                  <label class="form-label" for="epVariety">พันธุ์อ้อย</label>
                  <input type="text" class="form-input" id="epVariety" value="${p.variety === '-' ? '' : p.variety}" placeholder="เช่น ขอนแก่น 3" />
                </div>
              </div>
              <div class="form-row-2">
                <div class="form-group">
                  <label class="form-label" for="epPlantDate">วันปลูก / วันตัดตอ</label>
                  <input type="text" class="form-input" id="epPlantDate" value="${p.plantDate || ''}" placeholder="เช่น 26 ม.ค. 69" />
                </div>
                <div class="form-group">
                  <label class="form-label" for="epStatus">ป้ายสถานะ</label>
                  <select class="form-select" id="epStatus">
                    <option value="doing" ${p.status === 'doing' ? 'selected' : ''}>กำลังทำ</option>
                    <option value="due" ${p.status === 'due' ? 'selected' : ''}>ถึงคิว</option>
                    <option value="" ${!p.status ? 'selected' : ''}>ปกติ (ไม่มีป้าย)</option>
                  </select>
                </div>
              </div>
              <button type="button" class="sheet-btn primary" id="btnSaveEditPlot">บันทึกข้อมูลแปลง</button>
            `,
            onMount(body) {
              body.querySelector('#btnSaveEditPlot').addEventListener('click', () => {
                const name = body.querySelector('#epName').value.trim();
                const rai = Number(body.querySelector('#epRai').value);
                if (!name) { showToast('กรุณาใส่ชื่อแปลง'); return; }
                if (!rai || rai <= 0) { showToast('กรุณาใส่จำนวนไร่'); return; }
                p.name = name;
                p.rai = rai;
                p.variety = body.querySelector('#epVariety').value.trim() || '-';
                p.plantDate = body.querySelector('#epPlantDate').value.trim();
                const st = body.querySelector('#epStatus').value || null;
                p.status = st;
                p.activeJobDone = false;
                renderSummaryStrip();
                renderZoneList();
                renderPlotDetail();
                closeSheet();
                showToast('อัปเดตข้อมูลแปลงแล้ว');
              });
            }
          });
        });
      }

      /* ===== แผ่นล่าง "+ จดงานแปลงนี้" ===== */
      function openLogWorkSheet(plot) {
        const catMap = {
          spray:   { label: 'ฉีดยา',   kind: 'work' },
          water:   { label: 'ขึ้นน้ำ',  kind: 'work' },
          fert:    { label: 'ใส่ปุ๋ย',  kind: 'work' },
          tractor: { label: 'รถไถ',    kind: 'work' },
          cut:     { label: 'ตัดอ้อย', kind: 'work' },
          rain:    { label: 'ฝนตก',    kind: 'rain' }
        };
        openSheet({
          title: plot ? `จดงาน: ${plot.name}` : 'จดงานแปลงด่วน',
          subtitle: 'อ. 24 พ.ย. 69 · บันทึกเข้าประวัติงานทันที',
          bodyHTML: `
            <div class="form-group">
              <label class="form-label" for="lwCat">ชนิดงาน</label>
              <select class="form-select" id="lwCat">
                <option value="spray">ฉีดยาคุมหญ้า</option>
                <option value="water">ขึ้นน้ำ / ราดร่อง</option>
                <option value="fert">ใส่ปุ๋ย / บำรุง</option>
                <option value="tractor">รถไถ / บำรุงร่อง</option>
                <option value="cut">ตัดอ้อย & ส่งโรงงาน</option>
                <option value="rain">ฝนตก</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="lwTitle">ชื่องาน</label>
              <input type="text" class="form-input" id="lwTitle" placeholder="เช่น ราดร่อง/ขึ้นน้ำ หรือ ใส่ปุ๋ยสูตร 15-15-15" />
            </div>
            <div class="form-group">
              <label class="form-label" for="lwDetail">คนงาน / รถ / หมายเหตุ</label>
              <input type="text" class="form-input" id="lwDetail" placeholder="เช่น หำ + ผัน" />
            </div>
            <button type="button" class="sheet-btn primary" id="btnSaveLogWork">บันทึกงานลงแปลง</button>
          `,
          onMount(body) {
            body.querySelector('#btnSaveLogWork').addEventListener('click', () => {
              const targetPlot = plot || findPlotWithZone('nk-khwanai').plot;
              const cat = body.querySelector('#lwCat').value;
              const title = body.querySelector('#lwTitle').value.trim() || catMap[cat].label;
              const detail = body.querySelector('#lwDetail').value.trim();
              const info = catMap[cat];

              targetPlot.history.unshift({
                id: 'h-' + Date.now(),
                kind: info.kind,
                cat,
                catLabel: info.label,
                date: '24 พ.ย.',
                year: '69',
                span: '',
                countWeight: 1,
                title,
                detail,
                ongoing: false
              });

              if (cat === 'water' || cat === 'rain') {
                targetPlot.waterDays = 0;
                targetPlot.waterRounds.unshift({
                  round: targetPlot.waterRounds.length + 1,
                  kind: cat === 'rain' ? 'rain' : 'water',
                  label: info.label,
                  date: '24 พ.ย. 69',
                  note: detail || title
                });
              } else if (cat === 'fert') {
                targetPlot.ferts.unshift({ date: '24 พ.ย. 69', title, detail: detail || 'บันทึกจากหน้าแปลง' });
              } else if (cat === 'spray') {
                targetPlot.sprayTanks += 1;
                targetPlot.sprays.unshift({ date: '24 พ.ย. 69', title, detail: detail || 'บันทึกวันนี้', status: 'done' });
              }

              renderZoneList();
              if (state.activePlotId === targetPlot.id) renderPlotDetail();
              closeSheet();
              showToast(`จด "${title}" ลงแปลง ${targetPlot.name} แล้ว`);
            });
          }
        });
      }

      $('#btnQuickLogMain').addEventListener('click', () => openLogWorkSheet(null));

      /* ===== เมนูล่าง 5 ปุ่ม (วาดไว้ดูตำแหน่ง) ===== */
      document.querySelectorAll('.nav-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          const name = tab.dataset.tab;
          if (name === 'แปลง') {
            $('#app').scrollTo({ top: 0, behavior: 'smooth' });
            return;
          }
          showToast(`แท็บ "${name}" (วาดไว้ดูตำแหน่งของแอปจริง)`);
        });
      });

      /* ===== Initial Render ===== */
      renderSummaryStrip();
      renderSatelliteCard();
      renderZoneList();
    })();
  </script>
</body>
</html>
