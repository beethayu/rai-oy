<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ไร่อ้อย">
<meta name="theme-color" content="#2e7d32">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>จัดการไร่อ้อย 281 ไร่</title>
<style>
  html, body { overscroll-behavior: none; height: 100%; overflow: hidden; }
  html { background: #2e7d32; }
  body { margin: 0 !important; background: #fff; }
  #safe-top { position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top); background: #2e7d32; z-index: 2147483647; }
  #app { position: fixed; top: env(safe-area-inset-top); left: 0; right: 0; bottom: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: none; transform: translateZ(0); }
  #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px; box-sizing: border-box; text-align: center; background: #fff; z-index: 2147483646; font-family: -apple-system, sans-serif; color: #2e7d32; }
  #boot .spin { width: 42px; height: 42px; border: 4px solid #c8e6c9; border-top-color: #2e7d32; border-radius: 50%; animation: sp 0.8s linear infinite; }
  #boot button { padding: 10px 18px; font-size: 16px; margin: 4px; border-radius: 8px; border: 1px solid #2e7d32; background: #fff; color: #2e7d32; }
  #boot-err { color: #c62828; font-size: 13px; word-break: break-word; max-height: 40vh; overflow: auto; }
  @keyframes sp { to { transform: rotate(360deg); } }
  #api-toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: 90%; background: #333; color: #fff; padding: 10px 16px; border-radius: 10px; font: 14px -apple-system, sans-serif; z-index: 2147483647; display: none; }
  #api-busy { position: fixed; top: env(safe-area-inset-top); left: 0; height: 3px; width: 0; background: #ffeb3b; z-index: 2147483647; transition: width 0.3s; }
</style>
</head>
<body>
<div id="safe-top"></div>
<div id="app"></div>
<div id="api-busy"></div>
<div id="boot">
  <div class="spin"></div>
  <div id="boot-msg">กำลังโหลด…</div>
  <div id="boot-err"></div>
  <div id="boot-btn"></div>
</div>
<div id="api-toast"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzWvJ2M0C7ZHQTVTWVCFCh7ugALw9dWws9A52iYEYvpxivqWzRCN22qWa4R6mE5XcZBuA/exec';
const CACHE_KEY = 'raioy_app_html';
const TIMEOUT_MS = 60000;
const SHELL_IDS = new Set(['safe-top', 'app', 'api-busy', 'boot', 'api-toast']);
const APP = document.getElementById('app');
let stage = 'เริ่มต้น';
let booted = false;
const errors = [];

// ---------- ส่วนแสดงสถานะตอนโหลด ----------
function setStage(s) {
  stage = s;
  const m = document.getElementById('boot-msg');
  if (m) m.textContent = 'กำลังโหลด… (' + s + ')';
}
function showBootError(msg) {
  const b = document.getElementById('boot');
  if (!b) return;
  const spin = b.querySelector('.spin');
  if (spin) spin.style.display = 'none';
  document.getElementById('boot-msg').textContent = 'โหลดไม่สำเร็จ (ขั้น: ' + stage + ')';
  document.getElementById('boot-err').textContent = msg + (errors.length ? '\n' + errors.join('\n') : '');
  document.getElementById('boot-btn').innerHTML =
    '<button onclick="location.reload()">ลองใหม่</button>' +
    '<button onclick="clearAndReload()">ล้างแคชแล้วโหลดใหม่</button>';
}
function clearAndReload() {
  try { localStorage.removeItem(CACHE_KEY); } catch (e) {}
  location.reload();
}
window.addEventListener('error', e => {
  errors.push('• ' + (e.message || 'error') + (e.lineno ? ' (บรรทัด ' + e.lineno + ')' : ''));
});
setTimeout(() => { if (!booted) showBootError('ใช้เวลานานเกิน 20 วินาที'); }, 20000);

// ---------- แจ้งเตือน / แถบกำลังทำงาน ----------
function toast(msg, ms) {
  const t = document.getElementById('api-toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = 'none'), ms || 3500);
}
let busyCount = 0;
function busy(d) {
  busyCount = Math.max(0, busyCount + d);
  document.getElementById('api-busy').style.width = busyCount ? '70%' : '0';
}

// ---------- fetch พร้อมตัดเวลา ----------
function fetchWithTimeout(url, opts, ms) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, Object.assign({ redirect: 'follow', signal: ctrl.signal }, opts || {}))
    .catch(e => { throw (e.name === 'AbortError' ? new Error('หมดเวลาเชื่อมต่อ ลองใหม่อีกครั้ง') : e); })
    .finally(() => clearTimeout(timer));
}

function callApi(fn, args) {
  busy(1);
  return fetchWithTimeout(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, args: args })
  }, TIMEOUT_MS)
    .then(r => r.json())
    .then(j => { if (!j.ok) throw new Error(j.error || 'เกิดข้อผิดพลาด'); return j.result; })
    .finally(() => busy(-1));
}

// ---------- จำลอง google.script.run ----------
function makeRunner(cfg) {
  return new Proxy({}, {
    get(_, name) {
      if (name === 'withSuccessHandler') return f => makeRunner(Object.assign({}, cfg, { ok: f }));
      if (name === 'withFailureHandler') return f => makeRunner(Object.assign({}, cfg, { fail: f }));
      if (name === 'withUserObject') return u => makeRunner(Object.assign({}, cfg, { user: u }));
      if (typeof name !== 'string' || name === 'then') return undefined;
      return (...args) => {
        callApi(name, args).then(
          r => { if (cfg.ok) cfg.ok(r, cfg.user); },
          e => { if (cfg.fail) cfg.fail(e, cfg.user); else { console.error(e); toast('⚠️ ' + e.message); } }
        );
      };
    }
  });
}
window.google = {
  script: {
    run: makeRunner({}),
    host: { close() {}, setHeight() {}, setWidth() {}, editor: { focus() {} } },
    url: { getLocation(cb) { cb({ hash: location.hash.slice(1), parameter: {}, parameters: {} }); } }
  }
};

// ---------- ให้คำสั่งเดิมของแอปทำงานกับกล่อง #app ----------
window.scrollTo = window.scroll = function (a, b) {
  if (a && typeof a === 'object') APP.scrollTo(a); else APP.scrollTo(a || 0, b || 0);
};
window.scrollBy = function (a, b) {
  if (a && typeof a === 'object') APP.scrollBy(a); else APP.scrollBy(a || 0, b || 0);
};
const bodyRemove = document.body.removeChild.bind(document.body);
document.body.removeChild = function (n) {
  if (n && n.parentNode === document.body) return bodyRemove(n);
  if (n && n.parentNode) n.parentNode.removeChild(n);
  return n;
};

// ---------- ดึงและติดตั้งหน้าแอป ----------
function fetchAppHtml() {
  return fetchWithTimeout(API_URL + '?page=html', {}, 30000)
    .then(r => r.json())
    .then(j => { if (!j.ok) throw new Error(j.error); return j.html; });
}

function runScript(old) {
  return new Promise(res => {
    const s = document.createElement('script');
    for (const a of old.attributes) s.setAttribute(a.name, a.value);
    if (old.src) {
      s.removeAttribute('async');
      const t = setTimeout(res, 15000);
      s.onload = s.onerror = () => { clearTimeout(t); res(); };
      document.body.appendChild(s);
    } else {
      s.textContent = old.textContent;
      document.body.appendChild(s);
      res();
    }
  });
}

async function mount(html) {
  setStage('จัดหน้า');
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.head.querySelectorAll('style, link[rel="stylesheet"]').forEach(n => document.head.appendChild(document.adoptNode(n)));
  for (const a of doc.body.attributes) {
    if (a.name === 'class') document.body.classList.add(...a.value.split(/\s+/).filter(Boolean));
    else if (a.name !== 'style') document.body.setAttribute(a.name, a.value);
  }
  const scripts = [...doc.querySelectorAll('script')];
  scripts.forEach(s => s.remove());
  doc.body.querySelectorAll('style').forEach(n => document.head.appendChild(document.adoptNode(n)));
  const frag = document.createDocumentFragment();
  while (doc.body.firstChild) frag.appendChild(document.adoptNode(doc.body.firstChild));
  APP.appendChild(frag);

  const cs = getComputedStyle(document.body);
  APP.style.padding = cs.padding;
  APP.style.paddingBottom = 'calc(' + (cs.paddingBottom || '0px') + ' + env(safe-area-inset-bottom))';
  document.body.style.setProperty('padding', '0', 'important');

  new MutationObserver(list => {
    for (const m of list) for (const n of m.addedNodes) {
      if (n.nodeType === 1 && n.parentNode === document.body && !SHELL_IDS.has(n.id) &&
          n.tagName !== 'SCRIPT' && n.tagName !== 'STYLE') APP.appendChild(n);
    }
  }).observe(document.body, { childList: true });

  for (let i = 0; i < scripts.length; i++) {
    setStage('สคริปต์ ' + (i + 1) + '/' + scripts.length);
    await runScript(scripts[i]);
  }
  setStage('เริ่มแอป');
  try { document.dispatchEvent(new Event('DOMContentLoaded', { bubbles: true })); } catch (e) {}
  try { window.dispatchEvent(new Event('load')); } catch (e) {}
  booted = true;
  const b = document.getElementById('boot');
  if (b) b.remove();
}

(async function start() {
  let cached = null;
  const fresh = /[?&]fresh=1/.test(location.search);
  try { if (!fresh) cached = localStorage.getItem(CACHE_KEY); } catch (e) {}

  try {
    if (cached) {
      await mount(cached);
      fetchAppHtml().then(html => {
        if (html !== cached) {
          try { localStorage.setItem(CACHE_KEY, html); } catch (e) {}
          toast('🔄 มีหน้าแอปเวอร์ชันใหม่ ปิดแล้วเปิดแอปอีกครั้ง', 6000);
        }
      }).catch(() => {});
    } else {
      setStage('ดึงหน้าแอป');
      const html = await fetchAppHtml();
      try { localStorage.setItem(CACHE_KEY, html); } catch (e) {}
      await mount(html);
    }
  } catch (e) {
    try { localStorage.removeItem(CACHE_KEY); } catch (x) {}
    showBootError(e.message || String(e));
  }
})();
</script>
<script>
(function () {
  // ยืดกล่องแอปให้เต็มจอจริงในโหมดไอคอน
  function fitApp() {
    if (!navigator.standalone) return;
    const top = document.getElementById('safe-top').offsetHeight;
    const portrait = window.matchMedia('(orientation: portrait)').matches;
    const full = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
    APP.style.bottom = 'auto';
    APP.style.height = (Math.max(window.innerHeight, full) - top) + 'px';
  }
  fitApp();
  window.addEventListener('resize', fitApp);
  window.addEventListener('orientationchange', () => setTimeout(fitApp, 300));

  // ย้ายสีพื้นของแอปไปไว้ในกล่อง แล้วให้พื้นหลังจริงเป็นสีเขียว
  const wait = setInterval(() => {
    if (!booted) return;
    clearInterval(wait);
    const cs = getComputedStyle(document.body);
    APP.style.backgroundColor = cs.backgroundColor;
    APP.style.backgroundImage = cs.backgroundImage;
    document.body.style.setProperty('background', '#2e7d32', 'important');
    fitApp();
  }, 200);
})();
</script>
</body>
</html>
