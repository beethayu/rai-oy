<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ไร่อ้อย">
<meta name="theme-color" content="#2e7d32">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>จัดการไร่อ้อย 281 ไร่</title>
<style>
  html, body { overscroll-behavior: none; }
  html { background: #2e7d32; }
  body { margin: 0; min-height: 100vh; background: #fff; }
  #safe-top { position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top); background: #2e7d32; z-index: 2147483647; }
  #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #fff; z-index: 2147483646; font-family: -apple-system, sans-serif; color: #2e7d32; }
  #boot .spin { width: 42px; height: 42px; border: 4px solid #c8e6c9; border-top-color: #2e7d32; border-radius: 50%; animation: sp 0.8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  #api-toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: 90%; background: #333; color: #fff; padding: 10px 16px; border-radius: 10px; font: 14px -apple-system, sans-serif; z-index: 2147483647; display: none; }
  #api-busy { position: fixed; top: env(safe-area-inset-top); left: 0; height: 3px; width: 0; background: #ffeb3b; z-index: 2147483647; transition: width 0.3s; }
</style>
</head>
<body>
<div id="safe-top"></div>
<div id="api-busy"></div>
<div id="boot"><div class="spin"></div><div id="boot-msg">กำลังโหลด…</div></div>
<div id="api-toast"></div>

<script>
// ⬇️ ใส่ URL /exec ของคุณตรงนี้
const API_URL = 'https://script.google.com/macros/s/AKfycbzWvJ2M0C7ZHQTVTWVCFCh7ugALw9dWws9A52iYEYvpxivqWzRCN22qWa4R6mE5XcZBuA/exec';
const CACHE_KEY = 'raioy_app_html';
const TIMEOUT_MS = 60000;

// ---------- แจ้งเตือนเล็กๆ ----------
function toast(msg, ms) {
  const t = document.getElementById('api-toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = 'none'), ms || 3500);
}

// ---------- แถบสถานะกำลังทำงาน ----------
let busyCount = 0;
function busy(d) {
  busyCount = Math.max(0, busyCount + d);
  const b = document.getElementById('api-busy');
  b.style.width = busyCount ? '70%' : '0';
}

// ---------- เรียก Apps Script ----------
function callApi(fn, args) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
  busy(1);
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, args: args }),
    redirect: 'follow',
    signal: ctrl.signal
  })
    .then(r => r.json())
    .then(j => { if (!j.ok) throw new Error(j.error || 'เกิดข้อผิดพลาด'); return j.result; })
    .catch(e => { throw (e.name === 'AbortError' ? new Error('หมดเวลาเชื่อมต่อ ลองใหม่อีกครั้ง') : e); })
    .finally(() => { clearTimeout(timer); busy(-1); });
}

// ---------- จำลอง google.script.run ให้โค้ดเดิมใช้ได้ทันที ----------
function makeRunner(cfg) {
  return new Proxy({}, {
    get(_, name) {
      if (name === 'withSuccessHandler') return f => makeRunner(Object.assign({}, cfg, { ok: f }));
      if (name === 'withFailureHandler') return f => makeRunner(Object.assign({}, cfg, { fail: f }));
      if (name === 'withUserObject') return u => makeRunner(Object.assign({}, cfg, { user: u }));
      if (typeof name !== 'string' || name === 'then') return undefined;
      return (...args) => {
        callApi(name, args).then(
          r => { if (cfg.ok) cfg.ok(r, cfg.user); },
          e => { if (cfg.fail) cfg.fail(e, cfg.user); else { console.error(e); toast('⚠️ ' + e.message); } }
        );
      };
    }
  });
}
window.google = {
  script: {
    run: makeRunner({}),
    host: { close() {}, setHeight() {}, setWidth() {}, editor: { focus() {} } },
    url: { getLocation(cb) { cb({ hash: location.hash.slice(1), parameter: {}, parameters: {} }); } }
  }
};

// ---------- ดึงหน้าแอปจาก Index.html ----------
function fetchAppHtml() {
  return fetch(API_URL + '?page=html', { redirect: 'follow' })
    .then(r => r.json())
    .then(j => { if (!j.ok) throw new Error(j.error); return j.html; });
}

function runScript(old) {
  return new Promise(res => {
    const s = document.createElement('script');
    for (const a of old.attributes) s.setAttribute(a.name, a.value);
    if (old.src) {
      s.removeAttribute('async');
      s.onload = s.onerror = res;
      document.body.appendChild(s);
    } else {
      s.textContent = old.textContent;
      document.body.appendChild(s);
      res();
    }
  });
}

async function mount(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.head.querySelectorAll('style, link[rel="stylesheet"]').forEach(n => document.head.appendChild(document.adoptNode(n)));
  for (const a of doc.body.attributes) {
    if (a.name === 'class') document.body.classList.add(...a.value.split(/\s+/).filter(Boolean));
    else if (a.name !== 'style') document.body.setAttribute(a.name, a.value);
  }
  const scripts = [...doc.querySelectorAll('script')];
  scripts.forEach(s => s.remove());
  doc.body.querySelectorAll('style').forEach(n => document.head.appendChild(document.adoptNode(n)));
  const frag = document.createDocumentFragment();
  while (doc.body.firstChild) frag.appendChild(document.adoptNode(doc.body.firstChild));
  document.body.appendChild(frag);

  const fix = document.createElement('style');
  fix.textContent = 'body{padding-top:env(safe-area-inset-top)!important;padding-bottom:env(safe-area-inset-bottom)!important}';
  document.head.appendChild(fix);

  for (const s of scripts) await runScript(s);
  document.dispatchEvent(new Event('DOMContentLoaded', { bubbles: true }));
  window.dispatchEvent(new Event('load'));
  document.getElementById('boot').remove();
}

(async function start() {
  let cached = null;
  const fresh = /[?&]fresh=1/.test(location.search);
  try { if (!fresh) cached = localStorage.getItem(CACHE_KEY); } catch (e) {}

  if (cached) {
    await mount(cached);
    fetchAppHtml().then(html => {
      if (html !== cached) {
        try { localStorage.setItem(CACHE_KEY, html); } catch (e) {}
        toast('🔄 มีหน้าแอปเวอร์ชันใหม่ ปิดแล้วเปิดแอปอีกครั้ง', 6000);
      }
    }).catch(() => {});
    return;
  }

  try {
    const html = await fetchAppHtml();
    try { localStorage.setItem(CACHE_KEY, html); } catch (e) {}
    await mount(html);
  } catch (e) {
    document.getElementById('boot-msg').innerHTML =
      'โหลดไม่สำเร็จ: ' + e.message + '<br><br><button onclick="location.reload()" style="padding:10px 20px;font-size:16px">ลองใหม่</button>';
  }
})();
</script>
</body>
</html>
